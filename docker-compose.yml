networks:
  goip_net:

services:
  db:
    image: mariadb:10.5
    container_name: goip_mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - ./goip_db:/var/lib/mysql
      - ./goip.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - goip_net

  adminer:
    image: adminer
    container_name: goip_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - goip_net
    profiles: ["adminer"]

  sms:
    image: bzmn/goip-sms-server
    container_name: goip_sms_server
    restart: always
    ports:
      - "${GOIP_SMS_UDP_PORT}:44444/udp"
      - "${GOIP_SMS_HTTP_PORT}:80"
    environment:
      MYTIMEZONE: ${MYTIMEZONE}
      GOIP_WEB_LOGIN: ${GOIP_WEB_LOGIN}
      GOIP_WEB_PASSWORD: ${GOIP_WEB_PASSWORD}
      MYSQL_MAIN_HOST: goip_mariadb
      MYSQL_MAIN_PORT: "3306"
      MYSQL_MAIN_DB: ${MYSQL_DATABASE}
      MYSQL_MAIN_LOGIN: ${MYSQL_USER}
      MYSQL_MAIN_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - goip_net

  notificator:
    build: ./app_notificator
    container_name: goip_notificator
    restart: unless-stopped
    ports:
      - "${NOTIFICATOR_PORT}:5000"
    env_file:
      - ./app_notificator/.env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    volumes:
      - ./app_notificator/logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - goip_net
